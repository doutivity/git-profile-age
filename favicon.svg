<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Git Profile Age">
  <title>Git Profile Age</title>
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <!-- git graph: branch line with two commit nodes -->
  <path d="M18 14v36" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M18 32c0-8 6-10 14-10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="18" cy="14" r="5" fill="#ffffff"/>
  <circle cx="18" cy="50" r="5" fill="#ffffff"/>
  <!-- clock as the "age" commit node -->
  <circle cx="42" cy="40" r="13" fill="#ffffff"/>
  <circle cx="42" cy="40" r="10.5" fill="#0f766e"/>
  <path d="M42 33v7.5l5 3" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
